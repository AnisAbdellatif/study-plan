# Production stack for the VPS: the app, PostgreSQL and Caddy for HTTPS.
# Lives next to a .env file (see .env.example) in DEPLOY_PATH; the CI deploy job copies this file there.
# Caddy also serves the dev stack (compose.dev.yaml) on DEV_DOMAIN through the shared study-plan-proxy network.
name: study-plan

# Container logs are rotated at 3 x 10 MB, so they don't grow forever. The app logs no IP addresses and Caddy
# writes no access log; state the resulting retention in VITE_SERVER_LOG_RETENTION.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  app:
    logging: *logging
    # The deploy job tags the image it deployed as latest on the VPS, so manual `docker compose up -d` needs no pull.
    image: ${APP_IMAGE:?set APP_IMAGE}:${APP_TAG:-latest}
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PUBLIC_URL: https://${DOMAIN:?set DOMAIN}
      DATABASE_URL: postgres://${POSTGRES_USER:-studyplan}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-studyplan}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      SMTP_URL: ${SMTP_URL:?set SMTP_URL}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:?set SUPERADMIN_EMAIL}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:?set SUPERADMIN_PASSWORD}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Superadmin}
      REMINDER_INTERVAL_MINUTES: ${REMINDER_INTERVAL_MINUTES:-60}
      # Caddy replaces this header with the real client address, so rate limiting can trust it.
      IP_ADDRESS_HEADER: x-forwarded-for
    networks: [internal, web]

  postgres:
    image: postgres:18-alpine
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studyplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-studyplan}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published on the host; only the app reaches it.
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    logging: *logging
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      DEV_DOMAIN: ${DEV_DOMAIN:-dev.${DOMAIN}}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [web, proxy]

networks:
  internal:
    internal: true
  web:
  # Shared with the dev stack. Created by the deploy job: docker network create study-plan-proxy
  proxy:
    name: study-plan-proxy
    external: true

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
