# Production stack for the VPS: the app and PostgreSQL.
# Lives next to a .env file (see .env.example) in DEPLOY_PATH; the CI deploy job copies this file there.
# HTTPS comes from Caddy installed on the host (see deploy/Caddyfile), which forwards DOMAIN to the app port
# published on 127.0.0.1 below.
name: study-plan

# Container logs are rotated at 3 x 10 MB, so they don't grow forever. The app logs no IP addresses and the host's Caddy
# must write no access log, as the privacy policy states; update the policy if either changes.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  app:
    logging: *logging
    # The deploy job tags the image it deployed as latest on the VPS, so manual `docker compose up -d` needs no pull.
    image: ${APP_IMAGE:?set APP_IMAGE}:${APP_TAG:-latest}
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PUBLIC_URL: https://${DOMAIN:?set DOMAIN}
      DATABASE_URL: postgres://${POSTGRES_USER:-studyplan}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-studyplan}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      SMTP_URL: ${SMTP_URL:?set SMTP_URL}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:?set SUPERADMIN_EMAIL}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:?set SUPERADMIN_PASSWORD}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Superadmin}
      REMINDER_INTERVAL_MINUTES: ${REMINDER_INTERVAL_MINUTES:-60}
      # Caddy replaces this header with the real client address, so rate limiting can trust it.
      IP_ADDRESS_HEADER: x-forwarded-for
    # Only on the loopback interface: the host's Caddy is the single way in from outside. Docker's published
    # ports bypass host firewalls such as ufw, so never publish on 0.0.0.0 here.
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    # internal reaches PostgreSQL; web gives outbound access for SMTP.
    networks: [internal, web]

  postgres:
    image: postgres:18-alpine
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studyplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-studyplan}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published on the host; only the app reaches it.
    networks: [internal]

networks:
  internal:
    internal: true
  web:

volumes:
  postgres-data:
