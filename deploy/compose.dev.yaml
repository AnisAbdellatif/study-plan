# Dev stack for the VPS: the app built from the dev branch with its own PostgreSQL, in its own directory
# (DEV_DEPLOY_PATH) next to a .env file (see dev.env.example). The CI deploy job copies this file there as
# compose.yaml. It has no Caddy of its own: the production Caddy serves it on DEV_DOMAIN through the shared
# study-plan-proxy network, so the production stack must be running.
name: study-plan-dev

services:
  app:
    # The deploy job tags the image it deployed as dev on the VPS, so manual `docker compose up -d` needs no pull.
    image: ${APP_IMAGE:?set APP_IMAGE}:${APP_TAG:-dev}
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PUBLIC_URL: https://${DOMAIN:?set DOMAIN}
      DATABASE_URL: postgres://${POSTGRES_USER:-studyplan}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-studyplan}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      SMTP_URL: ${SMTP_URL:?set SMTP_URL}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:?set SUPERADMIN_EMAIL}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:?set SUPERADMIN_PASSWORD}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Superadmin}
      REMINDER_INTERVAL_MINUTES: ${REMINDER_INTERVAL_MINUTES:-0}
      IP_ADDRESS_HEADER: x-forwarded-for
    networks:
      internal:
      proxy:
        # The production Caddyfile forwards DEV_DOMAIN to this name.
        aliases: [study-plan-dev-app]

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studyplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-studyplan}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

networks:
  internal:
    internal: true
  proxy:
    name: study-plan-proxy
    external: true

volumes:
  postgres-data:
