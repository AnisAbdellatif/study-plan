# Dev stack for the VPS: the app built from the dev branch with its own PostgreSQL, in its own directory
# (DEV_DEPLOY_PATH) next to a .env file (see dev.env.example). The CI deploy job copies this file there as
# compose.yaml. The host's Caddy (see deploy/Caddyfile) serves it on the dev domain through the app port
# published on 127.0.0.1 below.
name: study-plan-dev

# Rotated container logs, as in compose.yaml.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  app:
    logging: *logging
    # The deploy job tags the image it deployed as dev on the VPS, so manual `docker compose up -d` needs no pull.
    image: ${APP_IMAGE:?set APP_IMAGE}:${APP_TAG:-dev}
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PUBLIC_URL: https://${DOMAIN:?set DOMAIN}
      DATABASE_URL: postgres://${POSTGRES_USER:-studyplan}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-studyplan}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      SMTP_URL: ${SMTP_URL:?set SMTP_URL}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:?set SUPERADMIN_EMAIL}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:?set SUPERADMIN_PASSWORD}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Superadmin}
      REMINDER_INTERVAL_MINUTES: ${REMINDER_INTERVAL_MINUTES:-0}
      IP_ADDRESS_HEADER: x-forwarded-for
      # Optional study assistant through OpenRouter. Without a key it stays off.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
    # Loopback only, as in compose.yaml, and a different port so both stacks run side by side.
    ports:
      - "127.0.0.1:${APP_PORT:-3001}:3000"
    networks: [internal, web]

  postgres:
    image: postgres:18-alpine
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studyplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-studyplan}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

networks:
  internal:
    internal: true
  web:

volumes:
  postgres-data:
