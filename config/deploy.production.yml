# Production (kit deploy -d production, from main). Merged over config/deploy.yml.
# On the server, /opt/study-plan holds app.env and postgres.env (deploy/app.env.example, deploy/postgres.env.example).

servers:
  web:
    options:
      env-file: /opt/study-plan/app.env

proxy:
  # ics.study-plan.de serves the calendar feeds only (CALENDAR_FEED_URL below); the app answers nothing else there.
  hosts:
    - study-plan.de
    - ics.study-plan.de

env:
  clear:
    PUBLIC_URL: https://study-plan.de
    REMINDER_INTERVAL_MINUTES: 60
    CALENDAR_FEED_URL: https://ics.study-plan.de

accessories:
  postgres:
    # The app's DATABASE_URL points here: postgres://studyplan:<password>@study-plan-postgres:5432/studyplan
    service: study-plan-postgres
    options:
      env-file: /opt/study-plan/postgres.env
    # The volume the compose stack created, so the data carries over as it is.
    volumes:
      - study-plan_postgres-data:/var/lib/postgresql
