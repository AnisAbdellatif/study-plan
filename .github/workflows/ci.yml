name: CI

# Changes land on dev first and reach main through pull requests. CI tests, and for pushes to main and dev builds the
# image and attests where it came from. It deploys nothing and holds no SSH key or app secret: a person deploys with
# deploy-kit, which checks this run passed for the exact commit and verifies the image's attestation (README,
# "Deployment").
on:
  push:
    branches: [main, dev]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  bun:
    name: Lint, typecheck, test (Bun)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun ci
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun audit --audit-level=high --prod

  node:
    name: Test on Node 24 (runtime fallback)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: bun ci
      - run: npx --no-install vitest run

  # The other jobs use the embedded PGlite database; production runs PostgreSQL, whose driver behaves differently.
  postgres:
    name: API tests on PostgreSQL
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun ci
      - run: bunx vitest run --project api

  # Only for pushes to main or dev, and only after all checks passed. The image is tagged with the full commit SHA,
  # which is the version Kamal deploys; one image serves both destinations.
  image:
    name: Build and push image
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'dev')
    needs: [bun, node, postgres]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push to GHCR with the job's own token
      id-token: write # sign the provenance (Sigstore, keyless)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GHCR names are lower case. Must match `image:` in config/deploy.yml and KIT_IMAGE in .kamal/kit.env.
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # Kamal only runs images labelled with its service: `service:` in config/deploy.yml.
          labels: service=study-plan
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ github.ref_name }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ github.ref_name }},mode=max
          # Operator details for the legal pages, compiled into the web app. Set them as repository variables.
          build-args: |
            VITE_OPERATOR_NAME=${{ vars.VITE_OPERATOR_NAME }}
            VITE_OPERATOR_STREET=${{ vars.VITE_OPERATOR_STREET }}
            VITE_OPERATOR_POSTAL_CITY=${{ vars.VITE_OPERATOR_POSTAL_CITY }}
            VITE_OPERATOR_EMAIL=${{ vars.VITE_OPERATOR_EMAIL }}
            VITE_OPERATOR_PHONE=${{ vars.VITE_OPERATOR_PHONE }}
            VITE_HOSTING_PROVIDER=${{ vars.VITE_HOSTING_PROVIDER }}
            VITE_MAIL_PROVIDER=${{ vars.VITE_MAIL_PROVIDER }}
      # Checked before every deploy (the kit's attestation step): an image this workflow didn't build is refused.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
